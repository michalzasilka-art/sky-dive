<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c7fdc">
<title>Sky Dive · Fugio</title>
<meta name="description" content="Sky Dive: skydive with Foxino, read the clue and fly through the holographic ring with the right English word. Ten questions, then open the parachute and land on the target.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sky.css?v=1">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="mist" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="labels" aria-hidden="true">
  <div class="ring-label"><span></span></div>
  <div class="ring-label"><span></span></div>
  <div class="ring-label"><span></span></div>
</div>

<div id="hud" class="hidden">
  <div id="clue">
    <div id="clueQ">QUESTION 1 / 10</div>
    <div id="clueText"></div>
    <div id="clueNote"></div>
  </div>
  <div id="stats">
    <div class="pill" id="scorePill"><small>SCORE</small><b id="score">0</b></div>
    <div class="pill" id="altPill"><small>ALT</small><b id="alt">0</b><small>m</small></div>
    <div class="pill streak hidden" id="streakPill"><b id="streak">x2</b><small>STREAK</small></div>
  </div>
  <div id="hint" class="hidden"><span class="hint-icon" aria-hidden="true"></span><span id="hintText">Move left and right to steer</span></div>
</div>

<div id="pop" aria-live="polite"></div>
<div id="bigText" aria-hidden="true"></div>

<button id="leaveBtn" class="topbtn" type="button" aria-label="Leave the game">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>LEAVE</span>
</button>
<button id="muteBtn" class="topbtn" type="button" aria-label="Sound on or off">
  <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>

<section id="start" class="screen hidden" aria-label="Start">
  <div class="title-wrap">
    <h1 class="title">SKY DIVE</h1>
    <p class="subtitle">Read the clue. Fly through the right word!</p>
  </div>
  <div class="panel start-panel">
    <h2>Choose a topic</h2>
    <div class="topics" id="topicsStart"></div>
    <button id="playBtn" class="bigbtn" type="button">PLAY</button>
  </div>
</section>

<section id="end" class="screen hidden" aria-label="Results">
  <div class="panel end-panel">
    <h2 id="endTitle">Great landing!</h2>
    <div class="stars" id="stars"><i></i><i></i><i></i></div>
    <div class="results">
      <div><b id="endRight">0 / 10</b><small>right answers</small></div>
      <div><b id="endScore">0</b><small>score</small></div>
    </div>
    <div id="practice" class="practice hidden"><small>Words to practise</small><div id="practiceWords"></div></div>
    <div class="topics compact" id="topicsEnd"></div>
    <button id="againBtn" class="bigbtn" type="button">PLAY AGAIN</button>
  </div>
</section>

<div id="loading"><div class="load-box"><div class="load-title">SKY DIVE</div><div class="load-bar"><i id="loadFill"></i></div><div class="load-text" id="loadText">Loading Foxino…</div></div></div>
<noscript>Sky Dive needs JavaScript.</noscript>
<script type="module" src="game.js?v=2"></script>
</body>
</html>
